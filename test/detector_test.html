<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>ZoneBreaker (ZB) - 风控环境检测复现实验室</title>
  <script src="../content/stealth.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    body {
      background-color: #f6f8fa;
      color: #24292f;
      padding: 30px 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 860px;
      width: 100%;
      background: #ffffff;
      border-radius: 12px;
      padding: 24px 30px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 2px solid #eaeef2;
      margin-bottom: 24px;
    }
    .header h2 {
      font-size: 20px;
      font-weight: 700;
      color: #1f2328;
    }
    .score-banner {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .score-tag {
      font-size: 16px;
      font-weight: bold;
      padding: 6px 16px;
      border-radius: 20px;
      background: #dafbe1;
      color: #1a7f37;
    }
    .score-tag.danger {
      background: #ffebe9;
      color: #cf222e;
    }
    .retest-btn {
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid #d0d7de;
      background: #f6f8fa;
      cursor: pointer;
      font-weight: 600;
    }
    .retest-btn:hover {
      background: #eaeef2;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .item-card {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      padding: 16px 20px;
      border-radius: 10px;
      border: 1px solid #d0d7de;
      background: #fafbfc;
      transition: all 0.2s;
    }
    .item-card.detected {
      border-color: #ff8182;
      background: #fff8f8;
    }
    .item-card.safe {
      border-color: #82e596;
      background: #f8fff9;
    }
    .item-icon {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      background: #ffffff;
      border: 1px solid #d0d7de;
      flex-shrink: 0;
    }
    .item-content {
      flex: 1;
    }
    .item-top {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .item-title {
      font-size: 15px;
      font-weight: 700;
      color: #1f2328;
    }
    .weight-tag {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 10px;
      background: #eaeef2;
      color: #57606a;
      font-weight: 600;
    }
    .claude-tag {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 10px;
      background: #ffd8bf;
      color: #d4380d;
      font-weight: 600;
    }
    .item-desc {
      font-size: 12px;
      color: #57606a;
      margin-bottom: 6px;
    }
    .item-evidence {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      padding: 4px 8px;
      background: #f1f3f5;
      border-radius: 4px;
      color: #24292f;
      display: inline-block;
    }
    .status-badge {
      font-size: 13px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      flex-shrink: 0;
    }
    .status-badge.detected {
      background: #ffebe9;
      color: #cf222e;
      border: 1px solid #ff8182;
    }
    .status-badge.safe {
      background: #dafbe1;
      color: #1a7f37;
      border: 1px solid #82e596;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h2>🛡️ ZoneBreaker (ZB) - 风控环境检测 1:1 复现实验室</h2>
        <p style="font-size: 13px; color: #57606a; margin-top: 4px;">对照用户截图所列之全部 10 项环境风控特征，实时测试当前浏览器状态。</p>
      </div>
      <div class="score-banner">
        <button class="retest-btn" id="retestBtn">🔄 重新检测</button>
        <div id="riskScoreBadge" class="score-tag">计算中...</div>
      </div>
    </div>

    <div class="list" id="testList"></div>
  </div>

  <script src="detector_test.js"></script>
</body>
</html>
